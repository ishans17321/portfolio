<div class="ocs__links--wide">
  <button type="button" class="ocs__btn alert-green fill" data-message="Sample check-in opened.">Complete Check-In</button>
  <a class="ocs__btn alert-green outline" href="https://www.mygoodbrain.org/resources" target="_blank" rel="noopener">Request Break</a>
  <a class="ocs__btn alert-red fill" href="https://www.mygoodbrain.org/resources" target="_blank" rel="noopener">Get Crisis Support</a>
</div>
<p id="button-result" role="status">No demo action selected.</p>
<script>
// This classroom demo provides feedback without storing or sending personal data.
document.querySelectorAll('button[data-message]').forEach(button => {
  button.addEventListener('click', () => {
    document.getElementById('button-result').textContent = button.dataset.message;
  });
});
</script>
